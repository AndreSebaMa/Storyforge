name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover tests
      - name: Build zip
        run: python .github/build_release.py dist/Storyforge.zip
      - name: Zip source bundle
        shell: pwsh
        run: Compress-Archive -Path server.py, desktop.py, web, start.bat, start.sh, README.md, LICENSE -DestinationPath dist/Storyforge-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Storyforge
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Storyforge.zip
            dist/Storyforge-source.zip
